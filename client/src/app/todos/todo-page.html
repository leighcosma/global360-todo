<main class="container">
  <h1>Your todos</h1>
  @if (store.error(); as message) {
    <p class="error" role="alert">{{ message }}</p>
  }
  @if (store.loading()) {
    <p class="loading" aria-live="polite">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="spinner"
        width="50"
        height="50"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="spinner"
      >
        <path d="M21 12a9 9 0 1 1-6.219-8.56" />
      </svg>
      <span class="visually-hidden">Loading todos</span>
    </p>
  } @else {
    <app-todo-list
      [todos]="store.todos()"
      [removing]="store.removing()"
      (remove)="store.remove($event)"
    />
    @if (adding()) {
      <app-todo-form class="tile" (cancelled)="adding.set(false)" />
    } @else {
      <button type="button" class="tile add" (click)="openForm()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-plus preview-icon"
        >
          <path d="M5 12h14" />
          <path d="M12 5v14" />
        </svg>
        Add a todo
      </button>
    }
  }
</main>
