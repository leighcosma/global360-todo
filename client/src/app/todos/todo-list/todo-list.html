<ul aria-label="Todos">
  @for (todo of todos(); track todo.id) {
    <li class="tile" [animate.enter]="animate() ? 'todo-enter' : ''" animate.leave="todo-leave">
      <app-todo-item
        [todo]="todo"
        [removing]="removing().has(todo.id)"
        (remove)="remove.emit(todo.id)"
      />
    </li>
  }
</ul>
